<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dream intro maker</title>
<style>
:root{--bg:#fff;--fg:#111;--mute:#888;--line:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--mute:#777;--line:#333;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--mute:#777;--line:#333;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.7 "Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:680px;margin:0 auto;padding:24px 16px 64px}
.layout{display:grid;gap:28px}
.out{order:-1;min-width:0}
.form label:first-child{margin-top:0}
summary{margin-top:16px;font-size:12px;color:var(--mute);text-transform:uppercase;cursor:pointer}
@media (min-width:900px){main{max-width:1040px;padding-top:40px}.layout{grid-template-columns:320px 1fr;gap:56px}.out{order:0;position:sticky;top:24px;align-self:start}}
input,textarea{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:inherit;font-size:16px;padding:9px 0;border-radius:0;outline:0}
input:focus,textarea:focus{border-color:var(--fg)}
textarea{resize:none}
label{display:block;margin-top:18px;font-size:12px;color:var(--mute);text-transform:uppercase}
.wrap{overflow:hidden;width:100%}
.card{width:600px;transform-origin:0 0;padding:28px;border:1.5px solid #000}
.top{display:flex;gap:28px}
.card .l{width:150px;flex:none;border-right:1px solid currentColor;padding-right:24px}
.card h2{margin:0;font-size:20px;font-weight:700;word-break:break-word}
.card .id{color:var(--mute);font-size:13px;word-break:break-word}
.card dl{margin:0;flex:1;display:grid;grid-template-columns:80px 1fr;gap:10px 16px;align-content:start}
.card dt{font-size:12px;color:var(--mute);padding-top:3px}
.card dd{margin:0;white-space:pre-wrap;word-break:break-word}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.ph{position:relative;height:160px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:22px;cursor:pointer;overflow:hidden}
.ph img{width:100%;height:100%;display:block;object-fit:cover}
.ph .x{position:absolute;top:4px;right:8px;font-size:16px;line-height:1;color:#fff;mix-blend-mode:difference}
.cap{font-size:12px;line-height:18px;color:var(--mute);margin-top:6px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{margin-top:10px;font-size:11px;color:var(--mute);text-transform:uppercase}
#ed,#pv{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#ed[hidden],#pv[hidden]{display:none}
.edbox{background:var(--bg);color:var(--fg);border:1px solid var(--fg);padding:16px;width:100%;max-width:564px}
#edc{width:100%;display:block;border:1px solid var(--line);cursor:grab;touch-action:none}
#edz{border:0;padding:0;margin:14px 0 0;accent-color:var(--fg)}
.edbox .btns button{padding:8px 4px;font-size:12px}
.btns{display:flex;gap:8px;margin-top:20px}
button{flex:1;padding:12px 4px;font-size:13px;white-space:nowrap;text-transform:uppercase;background:none;color:var(--fg);border:1px solid var(--fg);font:inherit;font-size:13px;cursor:pointer;border-radius:0}
button:hover{background:var(--fg);color:var(--bg)}
button[hidden]{display:none}
textarea.code{margin-top:16px;border:1px solid var(--line);padding:10px;font:12px/1.5 monospace;height:120px}
</style>
</head>
<body>
<main><div class="layout"><section class="form">
<label>name<input id="name" value="name"></label>
<label>id<input id="id" value="@twitter_id"></label>
<label>about<input id="about" value="adult / dream acc."></label>
<label>dream<input id="dream" value="oc × character"></label>
<label>ng<input id="ng" value="no repost, no image saving"></label>
<label>note<textarea id="note" rows="2">feel free to say hi.</textarea></label>
<label>caption 1<input id="cap0" value="caption 1"></label>
<label>caption 2<input id="cap1" value="caption 2"></label>

</section><section class="out">
<div class="wrap"><div class="card" id="card"></div></div>

<div class="btns">
<button id="save">save png</button>
<button id="copy">copy html</button>
<button id="theme">black / white</button>
</div>
<details><summary>html code</summary><textarea class="code" id="code" readonly></textarea></details></section></div>
<div id="ed" hidden><div class="edbox"><canvas id="edc" width="532" height="320"></canvas>
<input type="range" id="edz" step="0.01">
<div class="hint">drag to move / slider to zoom</div>
<div class="btns"><button id="edfit">fit</button><button id="edfill">fill</button><button id="edrep">replace</button><button id="edrm">remove</button><button id="eddone">done</button></div></div></div>
<div id="pv" hidden><div class="edbox"><img id="pvimg" alt="" style="width:100%;display:block"><div class="hint">long-press / right-click the image to save</div><div class="btns"><button id="pvx">close</button></div></div></div>
<input type="file" id="file" accept="image/*" hidden>
</main>
<script>
var F=[["ABOUT","about"],["DREAM","dream"],["NG","ng"],["NOTE","note"]];
var dark=false,photos=[null,null],imgs=[null,null],st=[null,null],slot=0;
function v(i){return document.getElementById(i).value}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function build(){
  var c=dark?"#111":"#fff",t=dark?"#eee":"#111",m="#888",ln=dark?"#333":"#ddd";
  var h='<div class="top"><div class="l"><h2>'+esc(v("name"))+'</h2><div class="id">'+esc(v("id"))+'</div></div><dl>';
  F.forEach(function(f){if(v(f[1]))h+='<dt>'+f[0]+'</dt><dd>'+esc(v(f[1]))+'</dd>'});
  h+='</dl></div><div class="photos">';
  var hasCap=v("cap0")||v("cap1");
  for(var i=0;i<2;i++)h+='<div><div class="ph" data-i="'+i+'">'+(photos[i]?'<img src="'+photos[i]+'" alt=""><span class="x" data-x="'+i+'">×</span>':'+')+'</div>'+(hasCap?'<div class="cap">'+esc(v("cap"+i))+'</div>':'')+'</div>';
  h+='</div>';
  var card=document.getElementById("card");
  card.innerHTML=h;
  card.style.background=c;card.style.color=t;card.style.borderColor="#000";
  card.querySelectorAll(".ph").forEach(function(p){
    p.style.borderColor=ln;
    p.onclick=function(e){
      var x=e.target.getAttribute("data-x");
      if(x!==null){photos[+x]=null;imgs[+x]=null;st[+x]=null;build();return}
      slot=+p.getAttribute("data-i");if(st[slot])openEd();else document.getElementById("file").click();
    };
  });
  var out='<div style="width:600px;padding:28px;border:1.5px solid #000;background:'+c+';color:'+t+';font:15px/1.7 sans-serif;box-sizing:border-box">'
   +'<div style="display:flex;gap:28px"><div style="width:150px;flex:none;border-right:1px solid '+t+';padding-right:24px"><div style="font-size:20px;font-weight:700">'+esc(v("name"))+'</div>'
   +'<div style="color:'+m+';font-size:13px">'+esc(v("id"))+'</div></div><div style="flex:1">';
  F.forEach(function(f){if(v(f[1]))out+='<div style="display:flex;gap:16px;margin-bottom:10px"><div style="width:80px;flex:none;font-size:12px;color:'+m+';padding-top:3px">'+f[0]+'</div><div style="white-space:pre-wrap">'+esc(v(f[1]))+'</div></div>'});
  out+='</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px">';
  for(var j=0;j<2;j++)out+='<div><div style="height:160px;border:1px solid '+ln+';overflow:hidden">'+(photos[j]?'<img src="'+photos[j]+'" alt="" style="width:100%;height:100%;display:block;object-fit:cover">':'')+'</div>'+(hasCap?'<div style="font-size:12px;line-height:18px;color:'+m+';margin-top:6px;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(v("cap"+j))+'</div>':'')+'</div>';
  out+='</div></div>';
  document.getElementById("code").value=out;
  fit();
}
function fit(){
  var w=document.querySelector(".wrap"),card=document.getElementById("card");
  var k=Math.min(1,w.clientWidth/600);
  card.style.transform="scale("+k+")";
  w.style.height=Math.ceil(card.offsetHeight*k)+"px";
}
window.addEventListener("resize",fit);
function wrap(ctx,text,w){
  var lines=[];
  text.split("\n").forEach(function(p){
    var line="",sp=-1;
    for(var i=0;i<p.length;i++){
      var test=line+p[i];
      if(ctx.measureText(test).width>w&&line){
        if(sp>0){lines.push(line.slice(0,sp));line=line.slice(sp+1)+p[i]}
        else{lines.push(line);line=p[i]}
        sp=line.lastIndexOf(" ");
      }else{line=test;if(p[i]===" ")sp=line.length-1}
    }
    lines.push(line);
  });
  return lines;
}
function render(){
  var S=2,W=600,P=28,LH=25.5,FONT='"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  var c=dark?"#111":"#fff",t=dark?"#eee":"#111",m="#888",ln=dark?"#333":"#ddd";
  var cv=document.createElement("canvas"),ctx=cv.getContext("2d");
  ctx.font="15px "+FONT;
  var rows=[],y=0;
  F.forEach(function(f){if(v(f[1])){var ls=wrap(ctx,v(f[1]),270);rows.push([f[0],ls]);y+=ls.length*LH+10}});
  y=Math.max(y-10,0);
  ctx.font="700 20px "+FONT;
  var nl=wrap(ctx,v("name"),126);
  ctx.font="13px "+FONT;
  var il=wrap(ctx,v("id"),126);
  var left=nl.length*34+il.length*22;
  var top=Math.max(y,left);
  var hasCap=v("cap0")||v("cap1");
  var H=Math.ceil(P+top+24+160+(hasCap?24:0)+P);
  var M=14;
  cv.width=(W+M*2)*S;cv.height=(H+M*2)*S;ctx.scale(S,S);
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W+M*2,H+M*2);ctx.translate(M,M);
  ctx.fillStyle=c;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#000";ctx.lineWidth=1.5;ctx.strokeRect(.75,.75,W-1.5,H-1.5);ctx.strokeStyle=t;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(P+150,P);ctx.lineTo(P+150,P+top);ctx.stroke();
  ctx.textBaseline="top";ctx.fillStyle=t;ctx.font="700 20px "+FONT;
  var ly=P+4;nl.forEach(function(s){ctx.fillText(s,P,ly);ly+=34});
  ctx.fillStyle=m;ctx.font="13px "+FONT;
  il.forEach(function(s){ctx.fillText(s,P,ly+2);ly+=22});
  var ry=P;
  rows.forEach(function(r){
    ctx.fillStyle=m;ctx.font="12px "+FONT;ctx.fillText(r[0],P+150+28,ry+5);
    ctx.fillStyle=t;ctx.font="15px "+FONT;
    r[1].forEach(function(s,i){ctx.fillText(s,P+150+28+96,ry+4+i*LH)});
    ry+=r[1].length*LH+10;
  });
  var pw=(W-P*2-12)/2,py=P+top+24;
  for(var i=0;i<2;i++){
    var px=P+i*(pw+12);
    if(imgs[i]&&imgs[i].complete)ctx.drawImage(imgs[i],px,py,pw,160);
    ctx.strokeStyle=ln;ctx.strokeRect(px+.5,py+.5,pw-1,159);
    if(hasCap){
      ctx.fillStyle=m;ctx.font="12px "+FONT;
      var tx=v("cap"+i);
      while(tx.length>1&&ctx.measureText(tx).width>pw){tx=tx.slice(0,-2)+"…"}
      ctx.fillText(tx,px,py+160+6+3);
    }
  }
  return cv;
}
document.querySelectorAll("input[id],textarea[id]").forEach(function(e){if(e.type!=="file"&&e.type!=="range")e.addEventListener("input",build)});
var FW=532,FH=320,edI=0,drag=null;
function bgc(){return dark?"#111":"#fff"}
function cov(o){return Math.max(FW/o.width,FH/o.height)}
function zmin(i){var o=st[i].img;return Math.min(Math.min(FW/o.width,FH/o.height)/cov(o),1)}
function clampSt(i){
  var q=st[i],sc=cov(q.img)*q.z,sw=q.img.width*sc,sh=q.img.height*sc;
  q.ox=sw>FW?Math.max(-(sw-FW)/2,Math.min((sw-FW)/2,q.ox)):0;
  q.oy=sh>FH?Math.max(-(sh-FH)/2,Math.min((sh-FH)/2,q.oy)):0;
}
function drawSt(i,ctx){
  var q=st[i],sc=cov(q.img)*q.z,sw=q.img.width*sc,sh=q.img.height*sc;
  ctx.fillStyle=bgc();ctx.fillRect(0,0,FW,FH);
  ctx.drawImage(q.img,FW/2+q.ox-sw/2,FH/2+q.oy-sh/2,sw,sh);
}
function refresh(i){
  if(!st[i])return;
  var cv=document.createElement("canvas");cv.width=FW;cv.height=FH;drawSt(i,cv.getContext("2d"));
  photos[i]=cv.toDataURL("image/jpeg",.85);imgs[i]=new Image();imgs[i].src=photos[i];
}
function edDraw(){drawSt(edI,document.getElementById("edc").getContext("2d"))}
function openEd(){
  edI=slot;var z=document.getElementById("edz");
  z.min=zmin(edI);z.max=4;z.value=st[edI].z;
  edDraw();document.getElementById("ed").hidden=false;
}
function closeEd(){refresh(edI);build();document.getElementById("ed").hidden=true}
(function(){
  var edc=document.getElementById("edc"),z=document.getElementById("edz");
  edc.onpointerdown=function(e){drag={x:e.clientX,y:e.clientY};edc.setPointerCapture(e.pointerId)};
  edc.onpointermove=function(e){
    if(!drag)return;
    var k=FW/edc.getBoundingClientRect().width,q=st[edI];
    q.ox+=(e.clientX-drag.x)*k;q.oy+=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};
    clampSt(edI);edDraw();
  };
  edc.onpointerup=edc.onpointercancel=function(){drag=null};
  z.oninput=function(){st[edI].z=+z.value;clampSt(edI);edDraw()};
  document.getElementById("edfit").onclick=function(){var q=st[edI];q.z=zmin(edI);q.ox=q.oy=0;z.value=q.z;edDraw()};
  document.getElementById("edfill").onclick=function(){var q=st[edI];q.z=1;q.ox=q.oy=0;z.value=1;edDraw()};
  document.getElementById("edrep").onclick=function(){slot=edI;document.getElementById("file").click()};
  document.getElementById("edrm").onclick=function(){photos[edI]=null;imgs[edI]=null;st[edI]=null;build();document.getElementById("ed").hidden=true};
  document.getElementById("eddone").onclick=closeEd;
})();
document.getElementById("file").onchange=function(){
  var fi=this,f=fi.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var im=new Image();
    im.onload=function(){
      st[slot]={img:im,z:1,ox:0,oy:0};
      refresh(slot);build();openEd();
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);fi.value="";
};
document.getElementById("theme").onclick=function(){dark=!dark;refresh(0);refresh(1);build()};
document.getElementById("copy").onclick=function(){
  var ta=document.getElementById("code");ta.select();
  try{navigator.clipboard.writeText(ta.value)}catch(e){try{document.execCommand("copy")}catch(_){}}
  var b=this;b.textContent="copied";setTimeout(function(){b.textContent="copy html"},1200);
};
document.getElementById("save").onclick=function(){
  var b=this,cv=render();
  cv.toBlob(async function(blob){
    if(!blob)return;
    try{
      var d=(window.claude&&claude.use)?await claude.use("downloads"):null;
      if(d){
        await d.save({filename:"dream-intro.png",data:blob});
        b.textContent="saved";setTimeout(function(){b.textContent="save png"},1200);
        return;
      }
    }catch(e){if(e&&e.code==="declined")return}
    document.getElementById("pvimg").src=cv.toDataURL("image/png");
    document.getElementById("pv").hidden=false;
  },"image/png");
};
document.getElementById("pvx").onclick=function(){document.getElementById("pv").hidden=true};
build();
</script>
</body>
</html>
